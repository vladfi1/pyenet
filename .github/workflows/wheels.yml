name: Wheel build

on: [create, release, workflow_dispatch]

jobs:
  build_wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest
            arch: aarch64

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up QEMU
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build
        uses: pypa/cibuildwheel@v3.4
        env:
          CIBW_BUILD_FRONTEND: "build"
          CIBW_SKIP: "cp3??t-*"
          CIBW_ARCHS_LINUX: ${{ matrix.arch || 'x86_64' }}
        with:
          output-dir: wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: python-wheel-${{ matrix.os }}-${{ matrix.arch || 'native' }}
          path: ./wheelhouse/*.whl
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v6
        with:
          path: dist/*.tar.gz
